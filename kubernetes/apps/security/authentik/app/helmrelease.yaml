---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  chart:
    spec:
      chart: *app
      version: 2026.5.6
      sourceRef:
        kind: HelmRepository
        name: authentik
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: authentik-secret
      valuesKey: pg_password
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secret
      valuesKey: secret_key
      targetPath: authentik.secret_key
  values:
    authentik:
        postgresql:
            host: postgres-rw.database.svc.cluster.local

    blueprints:
      configMaps:
        - authentik-blueprints

    postgresql:
        enabled: false

    server:
      env:
        - name: GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-secret
              key: GRAFANA_CLIENT_SECRET
        - name: CODER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-coder-secret
              key: CODER_CLIENT_SECRET

    worker:
      env:
        - name: GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-secret
              key: GRAFANA_CLIENT_SECRET
        - name: CODER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-coder-secret
              key: CODER_CLIENT_SECRET