---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  chart:
    spec:
      chart: *app
      version: 2026.5.6
      sourceRef:
        kind: HelmRepository
        name: authentik
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: authentik
      valuesKey: secret_key
      targetPath: authentik.secret_key
    - kind: Secret
      name: authentik
      valuesKey: postgres-password
      targetPath: authentik.postgresql.password
  values:
    postgresql:
      enabled: false
    redis:
      enabled: false
    authentik:

      postgresql:
        host: postgres-rw.database.svc.cluster.local
        port: 5432
        name: *app
        user: *app

      redis:
        host: dragonfly-operator.database.svc.cluster.local
        port: 6379