---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  chart:
    spec:
      chart: *app
      version: "2026.5.5"
      sourceRef:
        kind: HelmRepository
        name: authentik
  interval: 30m
  values:
    postgresql:
      enabled: false
    redis:
      enabled: false
    authentik:
      secret_key: ""

      postgresql:
        host: postgres-rw.database.svc.cluster.local
        port: 5432
        name: *app
        user: *app

      redis:
        host: dragonfly-operator.database.svc.cluster.local
        port: 6379