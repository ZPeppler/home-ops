---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  chart:
    spec:
      chart: *app
      version: 2026.5.6
      sourceRef:
        kind: HelmRepository
        name: authentik
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: authentik-db
      namespace: database
      valuesKey: password
      targetPath: authentik.postgresql.password
  values:
    authentik:
        secret_key: 'Y1TXMo052Ts0c9toZG+BYFjjYPOeH33HU\QKC1Gt7VLyRAs2oVASHjFVTpzQB01Iv5KODbp0bX3dXcP'
        # This sends anonymous usage-data, stack traces on errors and
        # performance data to sentry.io, and is fully opt-in
        error_reporting:
            enabled: true
        postgresql:
            host: postgres-rw.database.svc.cluster.local
    postgresql:
        enabled: false