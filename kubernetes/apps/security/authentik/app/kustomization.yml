---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - ./blueprints/flux-operator.yaml
      - ./blueprints/grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
