---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: authentik
  namespace: database
spec:
  cluster:
    name: postgres
  name: authentik
  ensure: present
  login: true
  passwordSecret:
    name: authentik-db
    namespace: database
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
  namespace: database
spec:
  cluster:
    name: postgres
  name: authentik
  owner: authentik