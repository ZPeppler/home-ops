---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-db
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: coder-db
    template:
      type: kubernetes.io/basic-auth
      data:
        username: coder
        password: "{{ .PG_PASS }}"
  dataFrom:
    - extract:
        key: coder
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: coder-dbr
  namespace: database
spec:
  cluster:
    name: postgres
  name: coder
  ensure: present
  login: true
  passwordSecret:
    name: coder-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: coder
  namespace: database
spec:
  cluster:
    name: postgres
  name: coder
  owner: coder