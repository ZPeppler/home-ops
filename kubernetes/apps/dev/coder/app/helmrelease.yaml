---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  chartRef:
    kind: OCIRepository
    name: coder
  interval: 1h
  values:
    env:
      - name: CODER_ACCESS_URL
        value: "https://coder.${SECRET_DOMAIN}"
      - name: CODER_PG_CONNECTION_URL
        valueFrom:
          secretKeyRef:
            name: coder-secret
            key: CODER_PG_CONNECTION_URL
      - name: CODER_OIDC_ISSUER_URL
        value: https://auth.${SECRET_DOMAIN}/application/o/coder
      - name: CODER_OIDC_CLIENT_ID
        value: coder
      - name: CODER_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: coder-secret
            key: CLIENT_SECRET
      - name: CODER_OIDC_EMAIL_DOMAIN
        value: fade-lab.com
      - name: CODER_OIDC_SIGN_IN_TEXT
        value: Log in with authentik
      - name: CODER_OIDC_ICON_URL
        value: https://authentik.company/static/dist/assets/icons/icon.png
      - name: CODER_OIDC_SCOPES
        value: openid,profile,email,offline_access
      - name: CODER_OIDC_EMAIL_FIELD
        value: email
      - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
        value: false
      - name: CODER_OIDC_USERNAME_FIELD
        value: preferred_username
      - name: CODER_DISABLE_PASSWORD_AUTH
        value: false
    envUseClusterAccessURL: false