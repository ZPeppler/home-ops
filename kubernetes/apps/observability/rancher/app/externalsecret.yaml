---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rancher
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rancher-secret
    template:
      data:
        bootstrap: "{{ .BOOTSTRAP_PASSWORD }}"
  dataFrom:
    - extract:
        key: rancher