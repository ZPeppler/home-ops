---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foundryvtt-11
spec:
  hostnames:
    - foundryvtt-11.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: foundryvtt-11
          namespace: tabletop
          port: 30000